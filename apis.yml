aid: mixerbox
name: MixerBox
description: MixerBox ("Super-Apps to Live Easier") is a Y Combinator and Initialized Capital-backed consumer
  software company that ships a broad family of AI assistant tools as ChatGPT plugins / GPT Actions. Its
  catalog spans music and podcasts (OnePlayer, Podcasts), weather, a Google Calendar assistant, translation
  and language learning, text-to-image generation, photo enhancement, PDF and academic-paper question
  answering (ChatPDF, Scholar), QR generation, diagram rendering, and prompt optimization. Each product
  publishes an OpenAI plugin manifest (/.well-known/ai-plugin.json) and an OpenAPI 3.1 specification;
  authentication is service-level or open.
